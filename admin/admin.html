<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | DoubleBolt</title>

    <!-- Reuse the storefront theme and add dashboard-specific styles. -->
    <link rel="stylesheet" href="../store/store.css" />
    <link rel="stylesheet" href="admin.css" />
    <script src="admin.js" defer></script>
  </head>

  <body>
    <header class="site-header">
      <div class="header-main container admin-header">
        <a
          class="logo"
          href="../store/index.html"
          aria-label="DoubleBolt store"
        >
          <svg class="double-bolt" viewBox="0 0 46 40" aria-hidden="true">
            <path d="M13 2 2 23h10L8 38l22-24H18l7-12Z" />
            <path d="m32 2-9 18h9l-5 18 18-24H35l7-12Z" />
          </svg>
          <span class="logo-double">DOUBLE</span>
          <span class="logo-bolt">BOLT</span>
        </a>

        <h1 class="admin-title">Admin Dashboard</h1>

        <div class="admin-account">
          <span id="adminIdentity">Checking session…</span>
          <button id="logoutButton" type="button" hidden>Sign out</button>
        </div>
      </div>
    </header>

    <main class="container admin-main">
      <p
        id="pageMessage"
        class="admin-message"
        role="status"
        aria-live="polite"
        hidden
      ></p>

      <!-- Shown until the admin signs in. JavaScript reveals the dashboard
           only after the API confirms the session has the admin role. -->
      <section id="loginPanel" class="admin-card" aria-labelledby="loginTitle">
        <h2 id="loginTitle">Admin sign in</h2>

        <form id="adminLoginForm">
          <label for="loginEmail">Email address</label>
          <input
            id="loginEmail"
            type="email"
            autocomplete="username"
            required
          />

          <label for="loginPassword">Password</label>
          <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            required
          />

          <button class="button button-primary" type="submit">Sign in</button>
          <p id="loginMessage" role="status" aria-live="polite"></p>
        </form>
      </section>

      <div id="adminDashboard" hidden>
        <nav class="admin-tabs" aria-label="Admin sections">
          <button type="button" data-panel="partsPanel">Parts</button>
          <button type="button" data-panel="brandsPanel">Brands</button>
          <button type="button" data-panel="usersPanel">Users</button>
          <button type="button" data-panel="ordersPanel">Orders</button>
        </nav>

        <section
          id="partsPanel"
          class="admin-card"
          aria-labelledby="partsTitle"
        >
          <h2 id="partsTitle">Parts</h2>

          <form id="partForm">
            <label for="partName">Name</label>
            <input id="partName" name="name" required maxlength="255" />

            <label for="partCategory">Category</label>
            <input id="partCategory" name="category" required maxlength="100" />

            <label for="partBrandId">Brand</label>
            <select id="partBrandId" name="brand_id" required>
              <option value="">Select a brand</option>
            </select>

            <label for="partPrice">Price</label>
            <input
              id="partPrice"
              name="price"
              type="number"
              min="0"
              step="0.01"
              required
            />

            <button class="button button-primary" type="submit">
              Add part
            </button>
            <button id="cancelPartEdit" class="button" type="button" hidden>
              Cancel edit
            </button>
          </form>

          <div class="collection-controls">
            <input
              id="partsSearch"
              type="search"
              placeholder="Search name or category"
            />

            <select id="partsBrandFilter" aria-label="Filter by brand">
              <option value="">All brands</option>
            </select>

            <select id="partsSortBy" aria-label="Sort parts by">
              <option value="id">Sort: ID</option>
              <option value="name">Name</option>
              <option value="category">Category</option>
              <option value="brand_id">Brand ID</option>
              <option value="price">Price</option>
            </select>

            <select id="partsSortDirection" aria-label="Parts sort direction">
              <option value="asc">Ascending</option>
              <option value="desc">Descending</option>
            </select>

            <button
              class="button button-primary"
              id="partsSearchButton"
              type="button"
            >
              Search
            </button>
            <button class="button" id="partsResetButton" type="button">
              Reset
            </button>
          </div>

          <div class="admin-table-wrap">
            <table>
              <thead>
                <tr>
                  <th scope="col">ID</th>
                  <th scope="col">Name</th>
                  <th scope="col">Category</th>
                  <th scope="col">Brand</th>
                  <th scope="col">Price</th>
                  <th scope="col">Actions</th>
                </tr>
              </thead>
              <tbody id="partsTableBody"></tbody>
            </table>
          </div>

          <div class="collection-pagination">
            <button class="button" id="partsPrevBtn" type="button">
              Previous
            </button>
            <span id="partsPageInfo">Page 1 of 1</span>
            <button class="button" id="partsNextBtn" type="button">Next</button>
          </div>
        </section>

        <section
          id="brandsPanel"
          class="admin-card"
          aria-labelledby="brandsTitle"
          hidden
        >
          <h2 id="brandsTitle">Brands</h2>

          <form id="brandForm">
            <label for="brandName">Brand name</label>
            <input id="brandName" name="name" required maxlength="100" />
            <button class="button button-primary" type="submit">
              Add brand
            </button>
            <button id="cancelBrandEdit" class="button" type="button" hidden>
              Cancel edit
            </button>
          </form>

          <div class="collection-controls">
            <input
              id="brandsSearch"
              type="search"
              placeholder="Search brand name"
            />

            <select id="brandsSortBy" aria-label="Sort brands by">
              <option value="id">Sort: ID</option>
              <option value="name">Name</option>
            </select>

            <select id="brandsSortDirection" aria-label="Brands sort direction">
              <option value="asc">Ascending</option>
              <option value="desc">Descending</option>
            </select>

            <button
              class="button button-primary"
              id="brandsSearchButton"
              type="button"
            >
              Search
            </button>
            <button class="button" id="brandsResetButton" type="button">
              Reset
            </button>
          </div>

          <div class="admin-table-wrap">
            <table>
              <thead>
                <tr>
                  <th scope="col">ID</th>
                  <th scope="col">Name</th>
                  <th scope="col">Actions</th>
                </tr>
              </thead>
              <tbody id="brandsTableBody"></tbody>
            </table>
          </div>

          <div class="collection-pagination">
            <button class="button" id="brandsPrevBtn" type="button">
              Previous
            </button>
            <span id="brandsPageInfo">Page 1 of 1</span>
            <button class="button" id="brandsNextBtn" type="button">
              Next
            </button>
          </div>
        </section>

        <section
          id="usersPanel"
          class="admin-card"
          aria-labelledby="usersTitle"
          hidden
        >
          <h2 id="usersTitle">Users</h2>

          <div class="collection-controls">
            <input
              id="usersSearch"
              type="search"
              placeholder="Search first or last name"
            />

            <select id="usersSortBy" aria-label="Sort users by">
              <option value="id">Sort: ID</option>
              <option value="first_name">First name</option>
              <option value="last_name">Last name</option>
            </select>

            <select id="usersSortDirection" aria-label="Users sort direction">
              <option value="asc">Ascending</option>
              <option value="desc">Descending</option>
            </select>

            <button
              class="button button-primary"
              id="usersSearchButton"
              type="button"
            >
              Search
            </button>
            <button class="button" id="usersResetButton" type="button">
              Reset
            </button>
          </div>

          <div class="admin-table-wrap">
            <table>
              <thead>
                <tr>
                  <th scope="col">ID</th>
                  <th scope="col">First name</th>
                  <th scope="col">Last name</th>
                  <th scope="col">Email</th>
                  <th scope="col">Role</th>
                  <th scope="col">Actions</th>
                </tr>
              </thead>
              <tbody id="usersTableBody"></tbody>
            </table>
          </div>

          <div class="collection-pagination">
            <button class="button" id="usersPrevBtn" type="button">
              Previous
            </button>
            <span id="usersPageInfo">Page 1 of 1</span>
            <button class="button" id="usersNextBtn" type="button">Next</button>
          </div>
        </section>

        <section
          id="ordersPanel"
          class="admin-card"
          aria-labelledby="ordersTitle"
          hidden
        >
          <h2 id="ordersTitle">Orders</h2>

          <div class="collection-controls">
            <input
              id="ordersUserIdFilter"
              type="number"
              min="1"
              placeholder="Filter by user ID"
            />

            <select id="ordersStatusFilter" aria-label="Filter by order status">
              <option value="">All statuses</option>
              <option value="Processing">Processing</option>
              <option value="Shipped">Shipped</option>
              <option value="Delivered">Delivered</option>
              <option value="Cancelled">Cancelled</option>
            </select>

            <select id="ordersSortBy" aria-label="Sort orders by">
              <option value="id">Sort: ID</option>
              <option value="user_id">User ID</option>
              <option value="status">Status</option>
            </select>

            <select id="ordersSortDirection" aria-label="Orders sort direction">
              <option value="asc">Ascending</option>
              <option value="desc">Descending</option>
            </select>

            <button
              class="button button-primary"
              id="ordersSearchButton"
              type="button"
            >
              Search
            </button>
            <button class="button" id="ordersResetButton" type="button">
              Reset
            </button>
          </div>

          <div class="admin-table-wrap">
            <table>
              <thead>
                <tr>
                  <th scope="col">Order ID</th>
                  <th scope="col">User ID</th>
                  <th scope="col">Status</th>
                  <th scope="col">Actions</th>
                </tr>
              </thead>
              <tbody id="ordersTableBody"></tbody>
            </table>
          </div>

          <div class="collection-pagination">
            <button class="button" id="ordersPrevBtn" type="button">
              Previous
            </button>
            <span id="ordersPageInfo">Page 1 of 1</span>
            <button class="button" id="ordersNextBtn" type="button">
              Next
            </button>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
