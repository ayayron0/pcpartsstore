openapi: 3.2.1
info:
  title: DoubleBolt API
  version: 1.1.0
  description: >
    Database-backed parts, brands, users, and orders API. Supports session
    authentication, role and ownership checks, JSON requests and responses,
    filtering, sorting, and pagination. XML and YAML representations are not
    currently supported.
servers:
  - url: http://localhost/pcpartsstore
    description: Wampoon; adjust port to match Apache.
paths:
  /auth/login:
    post:
      summary: Sign in
      description: Verifies credentials, creates a session, and returns the CSRF token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: Login successful; the server also sets the session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /auth/me:
    get:
      summary: Get the signed-in user's session
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current user and CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          $ref: "#/components/responses/NotAcceptable"
  /auth/logout:
    post:
      summary: Sign out
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: Session ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /parts:
    get:
      summary: List PC parts
      parameters:
        - in: query
          name: category
          required: false
          description: Filter by part category.
          schema:
            type: string
        - in: query
          name: brand_id
          required: false
          description: Filter by brand ID.
          schema:
            type: integer
            minimum: 1
        - in: query
          name: page
          required: false
          description: Page number (1-based).
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          required: false
          description: Items per page; maximum 50.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 5
        - in: query
          name: search
          required: false
          description: Search part names or categories; the search matches either field.
          schema:
            type: string
        - in: query
          name: sort
          required: false
          description: Field used to sort the parts.
          schema:
            type: string
            enum: [id, name, category, brand_id, price]
            default: id
        - in: query
          name: direction
          required: false
          description: Sort direction for the selected field.
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: Paginated parts collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartList"
              examples:
                populated:
                  value:
                    metadata:
                      total_items: 2
                      total_pages: 1
                      current_page: 1
                      per_page: 5
                    data:
                      - id: 1
                        name: GeForce RTX 5070
                        category: GPU
                        brand_id: 1
                        price: "749.99"
                      - id: 2
                        name: Radeon RX 8800 XT
                        category: GPU
                        brand_id: 2
                        price: "699.99"
                empty:
                  value:
                    metadata:
                      total_items: 0
                      total_pages: 0
                      current_page: 1
                      per_page: 5
                    data: []
        "400":
          $ref: "#/components/responses/BadRequest"
        "406":
          $ref: "#/components/responses/NotAcceptable"
    post:
      summary: Create part (existing handler)
      security:
        - sessionCookie: []
          csrfToken: []
      description: >
        Requires an authenticated admin session and a valid CSRF token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - category
                - brand_id
                - price
              properties:
                name:
                  type: string
                  example: Core i7-14700K
                category:
                  type: string
                  example: CPU
                brand_id:
                  type: integer
                  example: 3
                price:
                  type: number
                  example: 481.96
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - id
                properties:
                  message:
                    type: string
                    example: New PC part added
                  id:
                    type: string
                    example: "3"
                    description: PDO lastInsertId returns a string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /parts/{id}:
    get:
      summary: Read one PC part
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Existing database row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Part"
              example:
                id: 1
                name: GeForce RTX 5070
                category: GPU
                brand_id: 1
                price: "749.99"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
    patch:
      summary: Update part price (existing handler)
      security:
        - sessionCookie: []
          csrfToken: []
      description: >
        Requires an authenticated admin session and a valid CSRF token.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - price
              properties:
                price:
                  type: number
                  example: 425.82
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: PC part's price updated successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      summary: Delete part (existing handler)
      security:
        - sessionCookie: []
          csrfToken: []
      description: >
        Requires an authenticated admin session and a valid CSRF token. A part referenced by an order cannot be deleted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: PC part removed successfully
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
    put:
      summary: Replace a part
      security:
        - sessionCookie: []
          csrfToken: []
      description: >
        Requires an authenticated admin session and a valid CSRF token.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - category
                - brand_id
                - price
              properties:
                name:
                  type: string
                  example: Ryzen 7 9800X3D
                category:
                  type: string
                  example: CPU
                brand_id:
                  type: integer
                  example: 2
                  minimum: 1
                price:
                  type: number
                  example: 596.98
                  minimum: 0
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: PC part has been updated successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /brands:
    get:
      summary: List brands
      parameters:
        - in: query
          name: name
          required: false
          description: Filter by brand name.
          schema:
            type: string
        - in: query
          name: page
          required: false
          description: Page number (1-based).
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          required: false
          description: Items per page; maximum 50.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 5
        - in: query
          name: sort
          required: false
          description: Field used to sort the brands.
          schema:
            type: string
            enum: [id, name]
            default: id
        - in: query
          name: direction
          required: false
          description: Sort direction for the selected field.
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: Paginated brands collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandList"
              examples:
                populated:
                  value:
                    metadata:
                      total_items: 2
                      total_pages: 1
                      current_page: 1
                      per_page: 5
                    data:
                      - id: 1
                        name: NVIDIA
                      - id: 2
                        name: AMD
                empty:
                  value:
                    metadata:
                      total_items: 0
                      total_pages: 0
                      current_page: 1
                      per_page: 5
                    data: []
        "400":
          $ref: "#/components/responses/BadRequest"
        "406":
          $ref: "#/components/responses/NotAcceptable"
    post:
      summary: Create brand (existing handler)
      security:
        - sessionCookie: []
          csrfToken: []
      description: >
        Requires an authenticated admin session and a valid CSRF token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: ASUS
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - id
                properties:
                  message:
                    type: string
                    example: New brand added
                  id:
                    type: string
                    example: 5
                    description: PDO lastInsertId returns a string
        "400":
          $ref: "#/components/responses/BadRequest"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /brands/{id}:
    get:
      summary: Read one brand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Existing brand.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
              example:
                id: 1
                name: NVIDIA
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
    patch:
      summary: Update brand name (existing handler)
      security:
        - sessionCookie: []
          csrfToken: []
      description: >
        Requires an authenticated admin session and a valid CSRF token.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Corsair
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Brand name updated successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      summary: Delete brand (existing handler)
      security:
        - sessionCookie: []
          csrfToken: []
      description: >
        Requires an authenticated admin session and a valid CSRF token. A brand referenced by a part cannot be deleted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Brand removed successfully
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
    put:
      summary: Replace a brand
      security:
        - sessionCookie: []
          csrfToken: []
      description: >
        Requires an authenticated admin session and a valid CSRF token.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Crucial
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Brand has been updated successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /users:
    get:
      summary: List users
      security:
        - sessionCookie: []
      description: >
        Admin role required to list users.
      parameters:
        - in: query
          name: name
          required: false
          description: Filter by first or last name.
          schema:
            type: string
        - in: query
          name: page
          required: false
          description: Page number (1-based).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 1
        - in: query
          name: limit
          required: false
          description: Number of users per page.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 5
        - in: query
          name: sort
          required: false
          description: Sort by the selected field, then by ID ascending for ties.
          schema:
            type: string
            enum:
              - id
              - first_name
              - last_name
            default: id
        - in: query
          name: direction
          required: false
          description: Sorting direction for the selected field.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Collection, possibly empty
          content:
            application/json:
              schema:
                type: object
                required:
                  - metadata
                  - data
                properties:
                  metadata:
                    type: object
                    required:
                      - total_items
                      - total_pages
                      - current_page
                      - per_page
                    properties:
                      total_items:
                        type: integer
                        example: 2
                      total_pages:
                        type: integer
                        example: 1
                      current_page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 5
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - first_name
                        - last_name
                        - email
                        - role
                      properties:
                        id:
                          type: integer
                        first_name:
                          type: string
                          maxLength: 100
                        last_name:
                          type: string
                          maxLength: 100
                        email:
                          type: string
                          format: email
                          maxLength: 255
                        role:
                          type: string
                          enum: [admin, customer]
        "400":
          $ref: "#/components/responses/BadRequest"
        "406":
          $ref: "#/components/responses/NotAcceptable"
    post:
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - first_name
                - last_name
                - email
                - password
              properties:
                first_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                last_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                email:
                  type: string
                  format: email
                  maxLength: 255
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: Minimum length must match UsersController validation.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - id
                properties:
                  message:
                    type: string
                  id:
                    type: string
                    description: PDO lastInsertId returns a string
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      summary: Read user
      security:
        - sessionCookie: []
      description: >
        A user may read their own profile; an admin may read any profile.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Existing row
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - first_name
                  - last_name
                  - email
                properties:
                  id:
                    type: integer
                  first_name:
                    type: string
                    maxLength: 100
                  last_name:
                    type: string
                    maxLength: 100
                  email:
                    type: string
                    format: email
                    maxLength: 255
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "400":
          $ref: "#/components/responses/BadRequest"
    patch:
      summary: Update user
      security:
        - sessionCookie: []
          csrfToken: []
      description: >
        A user may update their own profile; an admin may update any profile. A valid CSRF token is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                first_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                last_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                email:
                  type: string
                  format: email
                  maxLength: 255
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Updated, including unchanged values
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Email already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
    delete:
      summary: Delete user
      security:
        - sessionCookie: []
          csrfToken: []
      description: >
        A user may delete their own account; an admin may delete any account. A valid CSRF token is required.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Cannot remove a user with orders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "400":
          $ref: "#/components/responses/BadRequest"
  /orders:
    get:
      summary: List orders
      security:
        - sessionCookie: []
      description: >
        Customers see their own orders; admins may see all orders and filter by user_id.
      parameters:
        - in: query
          name: user_id
          required: false
          description: Filter by user ID.
          schema:
            type: integer
            minimum: 1
        - in: query
          name: status
          required: false
          description: Filter by order status.
          schema:
            type: string
            enum:
              - Processing
              - Shipped
              - Delivered
              - Cancelled
        - in: query
          name: page
          required: false
          description: Page number (1-based).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 1
        - in: query
          name: limit
          required: false
          description: Number of orders per page.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 5
        - in: query
          name: sort
          required: false
          description: Sort by the selected field, then by ID ascending for ties.
          schema:
            type: string
            enum:
              - id
              - user_id
              - status
            default: id
        - in: query
          name: direction
          required: false
          description: Sorting direction for the selected field.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Paginated orders collection, possibly empty.
          content:
            application/json:
              schema:
                type: object
                required:
                  - metadata
                  - data
                properties:
                  metadata:
                    type: object
                    required:
                      - total_items
                      - total_pages
                      - current_page
                      - per_page
                    properties:
                      total_items:
                        type: integer
                        example: 2
                      total_pages:
                        type: integer
                        example: 1
                      current_page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 5
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - user_id
                        - status
                      properties:
                        id:
                          type: integer
                        user_id:
                          type: integer
                        status:
                          type: string
                          enum:
                            - Processing
                            - Shipped
                            - Delivered
                            - Cancelled
        "400":
          $ref: "#/components/responses/BadRequest"
        "406":
          $ref: "#/components/responses/NotAcceptable"
    post:
      summary: Create order
      security:
        - sessionCookie: []
          csrfToken: []
      description: >
        Creates an order for the authenticated user; user_id is assigned by the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - Processing
                    - Shipped
                    - Delivered
                    - Cancelled
                  default: Processing
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - id
                properties:
                  message:
                    type: string
                  id:
                    type: string
                    description: PDO lastInsertId returns a string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      summary: Read order
      security:
        - sessionCookie: []
      description: >
        A customer may read their own order; an admin may read any order.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Existing row
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - user_id
                  - status
                properties:
                  id:
                    type: integer
                  user_id:
                    type: integer
                  status:
                    type: string
                    enum:
                      - Processing
                      - Shipped
                      - Delivered
                      - Cancelled
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "400":
          $ref: "#/components/responses/BadRequest"
    patch:
      summary: Update order
      security:
        - sessionCookie: []
          csrfToken: []
      description: >
        Only admins may change order status. A valid CSRF token is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                status:
                  type: string
                  enum:
                    - Processing
                    - Shipped
                    - Delivered
                    - Cancelled
                  default: Processing
              required:
                - status
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Updated, including unchanged values
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
    delete:
      summary: Delete order
      security:
        - sessionCookie: []
          csrfToken: []
      description: >
        Requires an authenticated session and a valid CSRF token. The controller
        must enforce the intended order ownership or admin permission policy.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Cannot remove an order with items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "400":
          $ref: "#/components/responses/BadRequest"

  /parts/{id}/converted-price:
    get:
      summary: Convert a part's CAD price
      description: Combines a database part price with an external Frankfurter exchange rate.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
        - in: query
          name: currency
          required: false
          schema:
            type: string
            enum:
              - USD
              - EUR
              - GBP
            default: USD
      responses:
        "200":
          description: Original CAD price and converted price.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - name
                  - original_currency
                  - original_price
                  - target_currency
                  - exchange_rate
                  - converted_price
                  - rate_date
                  - rate_source
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  original_currency:
                    type: string
                    enum:
                      - CAD
                  original_price:
                    type: string
                    example: "749.99"
                  target_currency:
                    type: string
                    enum:
                      - USD
                      - EUR
                      - GBP
                  exchange_rate:
                    type: number
                    exclusiveMinimum: 0
                  converted_price:
                    type: string
                    example: "537.48"
                  rate_date:
                    type: string
                    format: date
                  rate_source:
                    type: string
                    example: Frankfurter
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "502":
          description: External rate lookup failed, timed out or returned invalid data. No conversion is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: PHPSESSID
      description: PHP session cookie; confirm the name against session_name().
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF token returned by login or the current-session endpoint.
  schemas:
    Part:
      type: object
      required:
        - id
        - name
        - category
        - brand_id
        - price
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: GeForce RTX 5070
        category:
          type: string
          example: GPU
        brand_id:
          type: integer
          example: 1
        price:
          type: string
          description: MariaDB DECIMAL returned by PDO as a string.
          example: "749.99"
    PartList:
      type: object
      required:
        - metadata
        - data
      properties:
        metadata:
          type: object
          required:
            - total_items
            - total_pages
            - current_page
            - per_page
          properties:
            total_items:
              type: integer
              example: 2
            total_pages:
              type: integer
              example: 1
            current_page:
              type: integer
              example: 1
            per_page:
              type: integer
              example: 5
        data:
          type: array
          items:
            $ref: "#/components/schemas/Part"
    Brand:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string
    BrandList:
      type: object
      required:
        - metadata
        - data
      properties:
        metadata:
          type: object
          required:
            - total_items
            - total_pages
            - current_page
            - per_page
          properties:
            total_items:
              type: integer
              example: 2
            total_pages:
              type: integer
              example: 1
            current_page:
              type: integer
              example: 1
            per_page:
              type: integer
              example: 5
        data:
          type: array
          items:
            $ref: "#/components/schemas/Brand"
    AuthLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AuthUser:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, customer]
    AuthLoginResponse:
      type: object
      required: [message, csrf_token, user]
      properties:
        message:
          type: string
          example: Login successful.
        csrf_token:
          type: string
        user:
          $ref: "#/components/schemas/AuthUser"
    AuthSessionResponse:
      type: object
      required: [user, csrf_token]
      properties:
        user:
          type: object
          required: [id, first_name, last_name, email, role]
          properties:
            id:
              type: integer
            first_name:
              type: string
            last_name:
              type: string
            email:
              type: string
              format: email
            role:
              type: string
              enum: [admin, customer]
        csrf_token:
          type: string
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    Error:
      type: object
      required:
        - status
        - error
      properties:
        status:
          type: integer
          example: 422
        error:
          type: string
          example: Validation Failed
        details:
          type: object
          additionalProperties:
            type: string
          description: Field-level validation errors.
  responses:
    Unauthorized:
      description: Authentication is required or the session is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: 401
            error: Authentication Required
    Forbidden:
      description: The user lacks permission or the CSRF token is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: 403
            error: Permission denied.
    Conflict:
      description: The operation conflicts with existing data or a database relationship.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: 409
            error: The operation conflicts with existing data.
    BadRequest:
      description: Malformed JSON, invalid path IDs or invalid query parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: 400
            error: Malformed JSON payload.
    NotFound:
      description: The requested resource or referenced record was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: 404
            error: Resource not found.
    NotAcceptable:
      description: The client requested a response format other than JSON.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: 406
            error: Not Acceptable. This API only provides application/json.
    UnsupportedMediaType:
      description: The request body Content-Type is not application/json.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: 415
            error: Unsupported Media Type. Please send application/json.
    ValidationFailed:
      description: The JSON body is valid, but one or more fields failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: 422
            error: Validation Failed
            details:
              name: Name is required and must be a string.
